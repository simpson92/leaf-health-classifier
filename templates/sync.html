{% extends "base.html" %}
{% block title %}동기식 분류{% endblock %}
{% block content %}
<section class="panel">
  <h2>동기식: 분석이 끝날 때까지 응답을 기다립니다</h2>
  <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
  <button id="send">동기 분류</button>
  <img id="preview" class="preview" hidden>
  <p id="state">이미지를 선택하세요.</p>
  <div id="result"></div>
  <details><summary>응답 JSON</summary><pre id="output">{}</pre></details>
</section>
<script>
const KO = {angular_leaf_spot: '각진잎반점병', bean_rust: '녹병', healthy: '정상'};
const fileEl = document.getElementById('image');
fileEl.onchange = () => {
  const f = fileEl.files[0];
  if (f) { const p = document.getElementById('preview'); p.src = URL.createObjectURL(f); p.hidden = false; }
};
function renderResult(data) {
  const box = document.getElementById('result');
  if (!data.all) { box.innerHTML = ''; return; }
  box.innerHTML = data.all.map(x => `
    <div class="bar-row">
      <span class="bar-label">${KO[x.label] || x.label}</span>
      <span class="bar"><span style="width:${(x.score * 100).toFixed(1)}%"></span></span>
      <span class="bar-value">${(x.score * 100).toFixed(1)}%</span>
    </div>`).join('');
}
document.getElementById('send').onclick = async () => {
  const file = fileEl.files[0];
  if (!file) { alert('이미지를 선택하세요'); return; }
  const button = document.getElementById('send'); button.disabled = true;
  const state = document.getElementById('state'); const out = document.getElementById('output');
  const form = new FormData(); form.append('image', file);
  const started = performance.now();
  state.textContent = '서버에서 추론 중...';
  try {
    const res = await fetch('/api/sync/classify/', {method: 'POST', body: form});
    const data = await res.json();
    const total = Math.round(performance.now() - started);
    state.textContent = res.ok
      ? `HTTP ${res.status} · 응답 ${total}ms · 추론 ${data.inference_ms ?? '-'}ms · 캐시 ${data.cache_hit ? 'HIT' : 'MISS'}`
      : `HTTP ${res.status} · ${data.detail}`;
    out.textContent = JSON.stringify(data, null, 2);
    renderResult(data);
  } catch (err) { state.textContent = `요청 실패: ${err}`; }
  finally { button.disabled = false; }
};
</script>
{% endblock %}
